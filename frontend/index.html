    <!--
      Cormorant Garamond is a plate-engraving face, used only at large sizes and in normal
      case -- it carries the star-atlas register without imitating any game's typography.
      IBM Plex Sans does all the reading and is legible at 11px, which is where most of this
      app's text lives. IBM Plex Mono carries every number, because a count is a measurement
      and should read like an instrument. All three SIL OFL.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"

    />

# TTM local stack.
#
# Deliberately few services. Postgres carries the data, the queue and the cache, so there
# is no Redis, no broker and no separate cache to operate -- see
# docs/02-target/architecture.md.
#
#   docker compose up -d postgres
#   docker compose run --rm migrate
#   docker compose run --rm ingest --descriptions
#   docker compose run --rm loader
#
# The solver image builds the C++ engine; it is invoked per job by the worker rather than
# run as a long-lived service.

name: ttm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttm}
      POSTGRES_USER: ${POSTGRES_USER:-ttm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttm_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, migrate races the first-boot initdb and fails on a cold volume.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ttm} -d ${POSTGRES_DB:-ttm}"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ttm:ttm_dev_only@postgres:5432/ttm}
    volumes:
      - ./services:/app/services
    command: ["python", "services/db/migrate.py"]

  # Fetches upstream talent data and writes tree JSON. Pass --descriptions to also
  # resolve tooltip text (a separate stage, so an outage there does not block trees).
  ingest:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    volumes:
      - ./services:/app/services
      - ./data:/app/data
    entrypoint: ["python", "services/ingest/ingest.py", "--out", "data/generated",
                 "--cache-dir", "data/cache", "--description-cache", "data/descriptions.json"]

  # Loads tree JSON into Postgres and precomputes build counts.
  loader:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ttm:ttm_dev_only@postgres:5432/ttm}
    volumes:
      - ./services:/app/services
      - ./tools:/app/tools
      - ./data:/app/data
    entrypoint: ["python", "services/db/load_trees.py"]

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ttm:ttm_dev_only@postgres:5432/ttm}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services:/app/services
      - ./tools:/app/tools
    # Watch only the app package: watching all of services/ meant editing a test file
    # restarted the server mid-request.
    command: ["uvicorn", "services.api.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/services/api",
              "--reload-exclude", "*test*"]

  # Claims solve jobs and execs the C++ engine. Scale with --scale worker=N; the queue
  # uses SKIP LOCKED so workers need no coordination.
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ttm:ttm_dev_only@postgres:5432/ttm}
    volumes:
      - ./services:/app/services
      - ./tools:/app/tools
    # A pathological job must not be able to take the host with it.
    cpus: ${WORKER_CPUS:-2}
    mem_limit: ${WORKER_MEMORY:-2g}

  # The C++ solver on its own, for builds and one-off runs. Not a service.
  solver:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    profiles: ["build-only"]

volumes:
  pgdata:

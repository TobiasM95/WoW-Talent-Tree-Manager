name: ingest

# Releases, plus a weekly run against live data.
#
# The weekly run is the one trigger not tied to a release, and on purpose: its job is to notice
# that upstream changed shape, which happens on Blizzard's schedule rather than ours. The legacy
# pipeline broke at the TWW pre-patch and nobody noticed until the tool was already dead. Weekly
# rather than daily, since a data change is not urgent to the day and compute is not free.
on:
  push:
    branches: [release]
    tags: ['v*']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  unit:
    name: transform + validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Synthetic payloads only: no network, so this can never be flaky.
      - name: ingest tests
        run: python services/ingest/tests/test_ingest.py

      # Counting modes and choice-side constraints. Synthetic trees, no network.
      - name: counting tests
        run: python tools/frontier-dp/test_counting.py

  live:
    name: live payload still ingests
    runs-on: ubuntu-latest
    # Network-dependent, so kept off the every-push path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/ingest/requirements.txt

      # Fails on an unknown node or entry type, a missing field, a broken graph, or a
      # payload that is not what we expect. A warning about the class or spec count
      # means Blizzard changed the roster and the expectation needs updating.
      # Keeps the payload it validated, so the tests below run on exactly the same bytes.
      - name: ingest live data
        run: python services/ingest/ingest.py --dry-run --cache-dir payload

      # Reuses the ingest's download rather than making a second one. The second one used
      # urllib's default User-Agent, which Raidbots answers with 403 -- so this job failed
      # on every scheduled run while the data itself was fine.
      - name: tests against the live payload
        run: python services/ingest/tests/test_ingest.py payload/talents-*.json

  crosscheck:
    name: DP and engine agree on ingested trees
    runs-on: ubuntu-latest
    # Builds the solver, ingests live data, and compares two independent
    # implementations over every tree. Network-dependent, so not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/ingest/requirements.txt

      - name: build the solver
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: ingest live data
        run: python services/ingest/ingest.py --out data/generated

      # The DP counts without enumerating; the engine counts by enumerating. Both read
      # the same tree JSON, so any disagreement means one of them is wrong.
      - name: cross-check every tree
        run: python tools/frontier-dp/crosscheck_json.py data/generated/trees build/ttm-solver 6 10 14

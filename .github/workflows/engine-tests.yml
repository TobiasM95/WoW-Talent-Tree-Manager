name: engine

# Releases only, not every push: see release.yml for why. The engine changes rarely, and when
# it does the change is on its way to a release anyway.
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  golden-counts:
    name: build + golden counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build -j "$(nproc)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exact combination counts for real presets. Each was confirmed twice:
      # by the C++ enumerator and by the independent frontier DP.
      - name: golden counts
        run: python tests/golden_counts.py build/ttm-solver --quick

      # The DP is a second, independent implementation. If the two ever disagree,
      # one of them has a bug -- which is the point of keeping both.
      - name: frontier DP agrees with the engine
        run: python tools/frontier-dp/validate.py tools/frontier-dp

  slow-counts:
    name: golden counts (including >2^31)
    runs-on: ubuntu-latest
    # The overflow case enumerates 3.3 billion solutions (~8 min): tagged releases and manual
    # runs only, not every push to the release branch.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j "$(nproc)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: golden counts, full set
        timeout-minutes: 45
        run: python tests/golden_counts.py build/ttm-solver

  # The browser counts and lists builds in TypeScript; the C++ engine is its maintained twin.
  # Both answer the same searches on every live tree and the custom fixtures, and must agree
  # exactly: counts at several budgets, and full listings as sets. A counting or tree feature
  # in one and not the other fails the release. See docs/03-plan/browser-only.md.
  browser-parity:
    name: browser counter and lister agree with the engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: build the engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/ingest/requirements.txt

      - name: ingest live retail and WoW Forever
        run: |
          python services/ingest/ingest.py --quiet --out data/generated
          python services/ingest/forever_ingest.py

      - name: the engine's answers
        run: >
          python tools/parity/engine_reference.py --solver build/ttm-solver
          --out frontend/.parity.json data/generated/trees data/generated-forever/trees

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: the browser agrees
        working-directory: frontend
        run: node parity.test.mjs .parity.json
